[package]
name = "desktime"
version = "0.1.0"
description = "A WebView2 desktop companion for Beijing time, quick notes, and schedules."
authors = ["DeskTime"]
edition = "2021"

[lib]
name = "desktime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.38"

# Release builds favor faster (re)compiles over binary micro-optimization — this
# is a desktop widget, runtime perf is not the bottleneck, iteration speed is.
[profile.release]
incremental = true
codegen-units = 256
